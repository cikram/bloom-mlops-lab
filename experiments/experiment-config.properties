# Bloom filter MLOps lab - experiment configuration
# Format: key=value (no spaces around '=', no quotes). Lines starting with '#' are comments.

# --- Dataset ---
dataset.version=synthetic-v1
data.unique=90000
data.duplicates=10000
data.seed=42

# --- Bloom filter (used by Experiment) ---
bloom.bits=862700
bloom.hashes=7

# --- Exact store: simulated cost of one lookup, in microseconds ---
store.lookupDelayMicros=50

# --- Measurement ---
repeats=10
fpr.newCandidates=10000

# --- Parameter experiments (used by ParameterExperiment) ---
# each run.X is "bits,hashes,insertedIds"
runs=A,B,C,D
run.A=1000,3,100
run.B=2000,3,100
run.C=1000,5,100
run.D=1000,3,300
run.duplicateFraction=0.1

# --- Output ---
results.file=reports/results.csv


# --- MLflow (optional) ---
# Leave mlflow.trackingUri empty to disable tracking (e.g. in CI)
mlflow.trackingUri=http://127.0.0.1:5000
mlflow.experimentName=bloom-mlops-lab


# --- CSV pipeline (used by CsvDeduplication) ---
# csv.input: file read by the pipeline; csv.output: accepted (deduplicated) records
csv.input=data/incoming.csv
csv.output=reports/accepted-records.csv