name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify

      - name: Disable MLflow (no tracking server in CI)
        run: sed -i 's/^mlflow.trackingUri=.*/mlflow.trackingUri=/' experiments/experiment-config.properties

      - name: Run parameter benchmark
        run: mvn -B -q compile exec:java -Dexec.mainClass=com.example.mlops.ParameterExperiment

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: reports/results.csv